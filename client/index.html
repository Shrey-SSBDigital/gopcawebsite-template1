<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOPCA - Gujarat Organic Products Certification Agency</title>
    <meta name="description" content="Official portal of the Gujarat Organic Products Certification Agency (GOPCA), offering NPOP organic certification, inspection standards, operator registry, and tariff calculators with a refined Nordic-artisanal aesthetic." />
    <meta property="og:title" content="GOPCA - Gujarat Organic Products Certification Agency" />
    <meta property="og:description" content="Official portal of the Gujarat Organic Products Certification Agency (GOPCA), offering NPOP organic certification, inspection standards, operator registry, and tariff calculators with a refined Nordic-artisanal aesthetic." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/images/gopca_logo.png" />
    <link rel="apple-touch-icon" href="/images/gopca_logo.png" />
  </head>
  <body class="bg-[#FAF8F5] text-[#1F2621] antialiased selection:bg-[#1B3826] selection:text-[#FAF8F5]">
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#FAF8F5;font-family:'Plus Jakarta Sans',sans-serif;z-index:9999;">
        <div style="width:104px;height:104px;border-radius:50%;background:#ffffff;border:1px solid #DFD8CC;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <img src="/images/gopca_logo.png" alt="GOPCA Logo" style="width:100%;height:100%;object-fit:contain;border-radius:50%;" />
        </div>
        <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:600;color:#17221A;letter-spacing:-0.02em;text-align:center;padding:0 16px;">
          Gujarat Organic Products Certification Agency
        </div>
        <div style="font-size:11px;font-weight:600;color:#8C6D37;text-transform:uppercase;letter-spacing:0.2em;margin-top:6px;">
          GOPCA · Government of Gujarat
        </div>
        <div style="width:180px;height:4px;background:#E5DFD4;border-radius:9999px;margin-top:24px;overflow:hidden;position:relative;">
          <div style="width:60px;height:100%;background:#1B3826;border-radius:9999px;animation:gopcaPreload 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes gopcaPreload {
          0% { transform: translateX(-100%); width: 40px; }
          50% { transform: translateX(60px); width: 80px; }
          100% { transform: translateX(200px); width: 40px; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
